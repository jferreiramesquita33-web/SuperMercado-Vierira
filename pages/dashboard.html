<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Supermercado Vieira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=13">
  <link rel="icon" type="image/png" href="../assets/img/logo-icon.png">
  <link rel="stylesheet" href="../assets/css/login-transition.css?v=1">
  <script src="../assets/js/login-transition.js?v=1"></script>
  <script src="../assets/js/historico.js?v=1"></script>
  <link rel="stylesheet" href="../assets/css/transitions.css?v=4">
  <script src="../assets/js/transitions.js?v=5"></script>
</head>
<body>
<div id="app"></div>
<dialog id="cadastro-senha" class="modal" aria-labelledby="titulo-senha">
  <form id="form-senha" method="post">
    <div class="modal-header"><h2 class="modal-title" id="titulo-senha">Cadastrar senha do Viera</h2></div>
    <div class="form-group">
      <label for="nova-senha">Nova senha</label>
      <input id="nova-senha" type="password" autocomplete="new-password" minlength="12" maxlength="72" required aria-describedby="ajuda-senha">
    </div>
    <div class="form-group">
      <label for="confirmar-senha">Repita a senha</label>
      <input id="confirmar-senha" type="password" autocomplete="new-password" required>
    </div>
    <p id="ajuda-senha" role="status">Use pelo menos 12 caracteres. Você poderá entrar com esta senha quando o e-mail não chegar.</p>
    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" id="cancelar-senha">Cancelar</button>
      <button class="btn btn-primary" type="submit">Salvar senha</button>
    </div>
  </form>
</dialog>
<script src="../assets/js/auth.js?v=12"></script>
<script src="../assets/js/storage.js?v=12"></script>
<script src="../assets/js/app.js?v=12"></script>
<script>

let dashboardProdutos = [];
let estoqueErro = false;
function buildDashboard() {
  const contas = SV.get('contasPagar').map(c => ({ ...c, status: resolveStatusPagar(c) }));
  const receber = SV.get('contasReceber').map(c => ({ ...c, status: resolveStatusReceber(c) }));
  const vales = SV.get('vales');
  const funcionarios = SV.get('funcionarios');
  const produtos = dashboardProdutos;
  const mes = currentMonth();

  const totalPago = contas.filter(c => (c.status === 'paga' || c.status === 'paga apos vencimento' || c.status === 'paga após vencimento') && isSameMonth(c.dataPagamento, mes)).reduce((s,c) => s + Number(c.valor || 0), 0);
  const totalRecebido = receber.filter(c => (c.status === 'recebida' || c.status === 'recebida em atraso') && isSameMonth(c.dataRecebimento, mes)).reduce((s,c) => s + Number(c.valor || 0), 0);
  const totalVales = vales.filter(v => isSameMonth(v.data, mes)).reduce((s,v) => s + Number(v.valor || 0), 0);
  const saldo = totalRecebido - totalPago - totalVales;

  const pagarAbertas = contas.filter(c => c.status === 'pendente' || c.status === 'vencida');
  const receberAbertas = receber.filter(c => c.status === 'pendente' || c.status === 'atrasada');
  const vencidas = contas.filter(c => c.status === 'vencida');
  const produtosComprar = produtos.filter(p => Boolean(p.comprar) || Number(p.estoque || 0) <= Number(p.minimo || 0));
  const ativos = funcionarios.filter(f => (f.status || 'ativo') === 'ativo');

  document.getElementById('app').innerHTML = `
  <div class="app-shell">
    ${renderSidebar('dashboard')}
    <div class="main-content">
      ${topbar('Dashboard')}
      <div class="page-content dashboard-minimal">
        <div class="section-header">
          <div>
            <h2 class="section-title">Visão geral</h2>
            <p class="page-subtitle">Resumo simples do mês atual</p>
          </div>
          <button class="btn btn-secondary" type="button" onclick="document.getElementById('cadastro-senha').showModal()">Cadastrar senha</button>
        </div>

        ${vencidas.length ? `<div class="alert alert-error mb-4">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span><b>${vencidas.length}</b> conta(s) vencida(s) precisam de atencao.</span>
        </div>` : ''}

        <div class="kpi-grid">
          <div class="kpi-card">
            <span>Recebido no mês</span>
            <strong class="text-green">${fmtMoney(totalRecebido)}</strong>
            <small>${receber.filter(c => c.status === 'recebida' || c.status === 'recebida em atraso').length} recebimentos</small>
          </div>
          <div class="kpi-card">
            <span>Pago no mês</span>
            <strong class="text-red">${fmtMoney(totalPago)}</strong>
            <small>${contas.filter(c => c.status === 'paga' || c.status === 'paga apos vencimento' || c.status === 'paga após vencimento').length} pagamentos</small>
          </div>
          <div class="kpi-card">
            <span>Saldo do periodo</span>
            <strong class="${saldo >= 0 ? 'text-green' : 'text-red'}">${saldo < 0 ? '-' : ''}${fmtMoney(Math.abs(saldo))}</strong>
            <small>recebidos - pagos - vales</small>
          </div>
          <div class="kpi-card">
            <span>Produtos para comprar</span>
            <strong class="${produtosComprar.length ? 'text-yellow' : 'text-green'}">${estoqueErro ? "—" : produtosComprar.length}</strong>
            <small>${estoqueErro ? "Estoque indisponível" : produtos.length + " produtos cadastrados"}</small>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="card">
            <div class="card-header">
              <span class="card-title">Fluxo dos últimos 6 meses</span>
            </div>
            <div id="fluxo"></div>
          </div>

          <div class="card">
            <div class="card-header">
              <span class="card-title">Pendências</span>
            </div>
            <div class="historico-filtro"><label for="escopo-contas">Contas dos últimos 6 meses</label>
              <select id="escopo-contas"><option value="abertas">Em aberto hoje</option><option value="todas">Todas as contas</option></select></div>
            <p class="historico-ajuda">Valores em reais por mês de vencimento.</p>
            <div id="historico-contas"></div>
            <div class="task-list">
              <a href="contas-pagar.html" class="task-item">
                <span>Contas a pagar abertas</span>
                <strong class="${pagarAbertas.length ? 'text-yellow' : 'text-green'}">${pagarAbertas.length}</strong>
              </a>
              <a href="contas-receber.html" class="task-item">
                <span>Contas a receber abertas</span>
                <strong class="${receberAbertas.length ? 'text-blue' : 'text-green'}">${receberAbertas.length}</strong>
              </a>
              <a href="produtos.html" class="task-item">
                <span>Produtos para comprar</span>
                <strong class="${produtosComprar.length ? 'text-red' : 'text-green'}">${produtosComprar.length}</strong>
              </a>
              <a href="funcionarios.html" class="task-item">
                <span>Funcionarios ativos</span>
                <strong>${ativos.length}</strong>
              </a>
            </div>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="card">
            <div class="card-header">
              <span class="card-title">Comprar agora</span>
              <a href="produtos.html" class="btn btn-secondary btn-sm">Abrir produtos</a>
            </div>
            ${produtosComprar.length === 0
              ? '<div class="empty-state"><p>' + (estoqueErro ? 'Não foi possível consultar o estoque. Tente novamente na página Produtos.' : 'Nenhum produto abaixo do minimo.') + '</p></div>'
              : `<div class="compact-list">
                ${produtosComprar.slice(0,6).map(p => `<div class="compact-row">
                  <div><strong>${escapeHTML(p.nome)}</strong><span>${escapeHTML(p.categoria || 'Outros')}</span></div>
                  <span class="badge badge-red">${Number(p.estoque || 0)} / ${Number(p.minimo || 0)} ${escapeHTML(p.unidade || 'un')}</span>
                </div>`).join('')}
              </div>`}
          </div>

          <div class="card">
            <div class="card-header">
              <span class="card-title">Contas vencidas</span>
              <a href="contas-pagar.html" class="btn btn-secondary btn-sm">Abrir contas</a>
            </div>
            ${vencidas.length === 0
              ? '<div class="empty-state"><p>Nenhuma conta vencida.</p></div>'
              : `<div class="compact-list">
                ${vencidas.slice(0,6).map(c => `<div class="compact-row">
                  <div><strong>${escapeHTML(c.descricao)}</strong><span>${fmtDate(c.dataVencimento)}</span></div>
                  <span class="font-mono text-red">${fmtMoney(c.valor)}</span>
                </div>`).join('')}
              </div>`}
          </div>
        </div>
      </div>
    </div>
  </div>`;

  const container = document.getElementById('historico-contas');
  const filtro = document.getElementById('escopo-contas');
  filtro.value = escopoContas;
  function atualizarHistorico() {
    escopoContas = filtro.value;
    container.replaceChildren(graficoSemestral(historicoSemestral(contas, receber, escopoContas),
      'Contas por vencimento', 'A pagar', 'A receber'));
  }
  filtro.onchange = atualizarHistorico;
  atualizarHistorico();
  document.getElementById('fluxo').replaceChildren(graficoSemestral(historicoSemestral(contas, receber, 'fluxo'),
    'Fluxo por data de pagamento ou recebimento', 'Saídas', 'Entradas'));
}
let escopoContas = 'abertas';
const dialogoSenha = document.getElementById('cadastro-senha');
const formSenha = document.getElementById('form-senha');
const ajudaSenha = document.getElementById('ajuda-senha');
const instrucaoSenha = ajudaSenha.textContent;
const salvarSenha = formSenha.querySelector('[type=submit]');
const cancelarSenha = document.getElementById('cancelar-senha');
cancelarSenha.onclick = () => dialogoSenha.close();
dialogoSenha.oncancel = evento => { if (salvarSenha.disabled) evento.preventDefault(); };
dialogoSenha.onclose = () => { formSenha.reset(); ajudaSenha.textContent = instrucaoSenha; };
formSenha.onsubmit = async evento => {
  evento.preventDefault();
  if (salvarSenha.disabled) return;
  const senha = document.getElementById('nova-senha').value;
  const confirmar = document.getElementById('confirmar-senha');
  if (senha !== confirmar.value) {
    ajudaSenha.textContent = 'As senhas são diferentes. Digite a mesma senha nos dois campos.';
    confirmar.focus();
    return;
  }
  salvarSenha.disabled = cancelarSenha.disabled = true;
  try {
    await requisitarAcesso('definir-senha', { senha });
    dialogoSenha.close();
    showToast('Senha salva. No próximo acesso, escolha Usar senha.', 'success');
  } catch (erro) {
    ajudaSenha.textContent = erro.message;
  } finally { salvarSenha.disabled = cancelarSenha.disabled = false; }
};
initBrightness();
iniciarPagina(async () => {
  try { dashboardProdutos = await carregarProdutos(); estoqueErro = false; }
  catch { dashboardProdutos = []; estoqueErro = true; }
  buildDashboard();
});
</script>
</body>
</html>
