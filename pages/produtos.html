<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

  <title>Produtos - Supermercado Vieira</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../assets/css/style.css?v=13">
  <link rel="icon" type="image/png" href="../assets/img/logo-icon.png">
  <link rel="stylesheet" href="../assets/css/transitions.css?v=4">
  <script src="../assets/js/transitions.js?v=5"></script>
</head>

<body>

<div id="app" aria-busy="true">
  <main class="page-content">
    <div class="card">
      <div class="empty-state" role="status" aria-live="polite">
        <h2>Produtos</h2>
        <p>Carregando produtos…</p>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay" inert>
  <form id="form-produto" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"
        onsubmit="event.preventDefault(); salvar()">

    <div class="modal-header">
      <span class="modal-title" id="modal-title">Novo Produto</span>

      <button type="button" class="modal-close" aria-label="Fechar formulário" onclick="closeModal()">×</button>
    </div>

    <div id="campos-produto">
      <fieldset id="modal-body" aria-label="Dados do produto"></fieldset>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="salvar-produto" type="submit">Salvar produto</button>
    </div>
  </form>
</div>


<dialog id="acesso-gerente" class="modal" aria-labelledby="titulo-acesso-gerente">
  <form id="form-acesso-gerente" method="post">
    <div class="modal-header"><h2 class="modal-title" id="titulo-acesso-gerente">Confirmar edição de produtos</h2></div>
    <div class="form-group">
      <label for="email-gerente">E-mail do gerente</label>
      <input id="email-gerente" type="email" autocomplete="username" autocapitalize="none" required>
    </div>
    <div class="form-group" id="etapa-confirmacao" hidden>
      <label for="prova-gerente">Link ou código recebido por e-mail</label>
      <input id="prova-gerente" type="password" autocomplete="one-time-code" maxlength="4096">
    </div>
    <div class="form-group" hidden>
      <label for="senha-gerente">Senha do Viera</label>
      <input id="senha-gerente" name="password" type="password" autocomplete="current-password" disabled>
    </div>
    <p id="aviso-gerente" role="status" aria-live="polite"></p>
    <div class="metodos-acesso">
      <button type="button" class="btn btn-secondary" data-usar-senha>Usar senha</button>
      <button type="button" class="btn btn-secondary" data-usar-mensagem>Colar link ou digitar código</button>
      <button type="button" class="btn btn-secondary" data-reiniciar hidden>Trocar e-mail ou reenviar</button>
    </div>
    <div class="modal-footer">
      <button id="cancelar-gerente" class="btn btn-secondary" type="button">Cancelar</button>
      <button id="confirmar-gerente" class="btn btn-primary" type="submit">Enviar acesso</button>
    </div>
  </form>
</dialog>

<script src="../assets/js/visitante.js?v=1"></script>
<script src="../assets/js/auth.js?v=14"></script>
<script src="../assets/js/form-acesso.js?v=4"></script>
<script src="../assets/js/gerente-produtos.js?v=3"></script>
<script src="../assets/js/storage.js?v=12"></script>
<script src="../assets/js/app.js?v=13"></script>

<script>

initBrightness();

let editId = null;
let salvando = false;
let currentFilter = "todos";
let produtosCache = [];
let carregandoProdutos = false;


// =====================================================
// API
// =====================================================

let chaveCadastro, versaoFormulario;
async function gravarProduto(url, metodo, dados, headers) {
  const resposta = await alterarComoGerente(url, {
    method: metodo, headers: { 'Content-Type': 'application/json', ...headers },
    body: dados ? JSON.stringify(dados) : undefined
  });
  const resultado = await resposta.json();
  if (!resposta.ok || !resultado.produto?.id) throw new Error(resultado.erro || 'O banco não confirmou a alteração.');
  return resultado.produto;
}
function criarProduto(dados) {
  return gravarProduto('/api/produtos','POST', dados, { 'Idempotency-Key': chaveCadastro });
}
function atualizarProduto(id, dados, versao = versaoFormulario) {
  return gravarProduto('/api/produtos/' + id,'PUT',dados,{ 'If-Match': String(versao) });
}
function removerProduto(id, versao) {
  return gravarProduto('/api/produtos/' + id,'DELETE',null,{ 'If-Match': String(versao) });
}

// =====================================================
// REGRAS
// =====================================================

function precisaComprar(produto) {

  return (
    Boolean(produto.comprar) ||
    Number(produto.estoque || 0) <= Number(produto.minimo || 0)
  );
}


function statusProduto(produto) {

  return precisaComprar(produto)

    ? '<span class="badge badge-red">Precisa comprar</span>'

    : '<span class="badge badge-green">Não precisa</span>';
}


function dinheiro(valor) {

  return Number(valor || 0).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}


// =====================================================
// CARREGAR PÁGINA
// =====================================================

async function carregarPaginaProdutos() {

  if (carregandoProdutos) return;
  carregandoProdutos = true;
  const botao = document.getElementById('tentar-produtos');
  if (botao) {
    botao.disabled = true;
    botao.textContent = 'Carregando...';
  }
  const app = document.getElementById('app');
  app.setAttribute('aria-busy', 'true');
  app.innerHTML = `
    <div class="app-shell">
      ${renderSidebar('produtos')}
      <div class="main-content">
        ${topbar('Produtos')}
        <main class="page-content">
          <div class="card">
            <div class="empty-state" role="status" aria-live="polite">
              <h2>Carregando produtos…</h2>
              <p>Consultando o estoque. O menu continua disponível.</p>
            </div>
          </div>
        </main>
      </div>
    </div>`;
  try {

    produtosCache = await carregarProdutos();

    render();

  } catch (erro) {

    console.error(erro);

    document.getElementById("app").innerHTML = `

      <div class="app-shell">

        ${renderSidebar("produtos")}

        <div class="main-content">

          ${topbar("Produtos")}

          <div class="page-content">

            <div class="card">

              <div class="empty-state" role="alert">

                <h3>Erro ao carregar produtos</h3>

                <p>${escapeHTML(erro.message)}</p>

                <button id="tentar-produtos" class="btn btn-primary" style="margin-top:16px" onclick="carregarPaginaProdutos()">Tentar novamente</button>

              </div>

            </div>

          </div>

        </div>

      </div>

    `;
  } finally {
    app.setAttribute('aria-busy', 'false');
    carregandoProdutos = false;
  }
}


// =====================================================
// RENDER
// =====================================================

function render() {

  const produtos = [...produtosCache];

  const comprar = produtos.filter(precisaComprar);

  const ok = produtos.filter(p => !precisaComprar(p));

  const categorias = [
    ...new Set(
      produtos.map(
        p => p.categoria || "Outros"
      )
    )
  ].sort();


  const lista = produtos

    .filter(p => {

      if (currentFilter === "comprar") {

        return precisaComprar(p);

      }

      if (currentFilter === "ok") {

        return !precisaComprar(p);

      }

      return true;

    })

    .sort((a, b) => {

      const compraA = Number(precisaComprar(a));

      const compraB = Number(precisaComprar(b));

      return (
        compraB - compraA ||
        String(a.nome).localeCompare(String(b.nome))
      );

    });


  document.getElementById("app").innerHTML = `

    <div class="app-shell">

      ${renderSidebar("produtos")}

      <div class="main-content">

        ${topbar("Produtos")}

        <div class="page-content">

          <div class="section-header">

            <h2 class="section-title">
              Lista de Produtos do Supermercado
            </h2>

            <button
              class="btn btn-primary"
              onclick="openModal()"
            >

              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >

                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>

              </svg>

              Novo Produto

            </button>

          </div>


          <div class="product-summary">

            <div class="product-summary-item">

              <strong>${produtos.length}</strong>

              <span>produtos cadastrados</span>

            </div>


            <div class="product-summary-item">

              <strong class="text-red">
                ${comprar.length}
              </strong>

              <span>precisam comprar</span>

            </div>


            <div class="product-summary-item">

              <strong class="text-green">
                ${ok.length}
              </strong>

              <span>não precisam comprar</span>

            </div>


            <div class="product-summary-item">

              <strong class="text-blue">
                ${categorias.length}
              </strong>

              <span>categorias</span>

            </div>

          </div>


          <div class="filters">

            <button
              class="btn ${
                currentFilter === "todos"
                  ? "btn-primary"
                  : "btn-secondary"
              }"
              onclick="setFilter('todos')"
            >
              Todos
            </button>


            <button
              class="btn ${
                currentFilter === "comprar"
                  ? "btn-primary"
                  : "btn-secondary"
              }"
              onclick="setFilter('comprar')"
            >
              Precisa comprar
            </button>


            <button
              class="btn ${
                currentFilter === "ok"
                  ? "btn-primary"
                  : "btn-secondary"
              }"
              onclick="setFilter('ok')"
            >
              Não precisa
            </button>

          </div>


          <div class="card">

            <div class="card-header">

              <span class="card-title">
                Controle de estoque e compras
              </span>

              <span class="text-muted">
                ${lista.length} item(ns)
              </span>

            </div>


            ${
              lista.length === 0

              ?

              `
                <div class="empty-state">

                  <p>
                    Nenhum produto neste filtro.
                  </p>

                </div>
              `

              :

              `

              <div class="table-wrap">

                <table>

                  <thead>

                    <tr>

                      <th>Produto</th>
                      <th>Categoria</th>
                      <th>Preço</th>
                      <th>Estoque</th>
                      <th>Mínimo</th>
                      <th>Status</th>
                      <th>Ações</th>

                    </tr>

                  </thead>


                  <tbody>

                    ${lista.map(p => {

                      const need = precisaComprar(p);

                      const estoque = Number(
                        p.estoque || 0
                      );

                      const minimo = Number(
                        p.minimo || 0
                      );

                      const pct = minimo > 0

                        ? Math.min(
                            100,
                            Math.round(
                              (estoque / minimo) * 100
                            )
                          )

                        : 100;


                      return `

                        <tr class="${
                          need
                            ? "product-row-buy"
                            : "product-row-ok"
                        }">

                          <td>
                            <b>${escapeHTML(p.nome)}</b>
                          </td>


                          <td>
                            <span class="text-muted">
                              ${escapeHTML(p.categoria || "Outros")}
                            </span>
                          </td>


                          <td>
                            ${dinheiro(p.preco)}
                          </td>


                          <td>

                            <span class="font-mono">

                              ${estoque}
                              ${escapeHTML(p.unidade || "un")}

                            </span>


                            <div class="stock-meter">

                              <div
                                class="stock-meter-fill ${
                                  need ? "" : "ok"
                                }"
                                style="width:${pct}%"
                              ></div>

                            </div>

                          </td>


                          <td class="font-mono">

                            ${minimo}
                            ${escapeHTML(p.unidade || "un")}

                          </td>


                          <td>
                            ${statusProduto(p)}
                          </td>


                          <td>

                            <div class="td-actions">

                              <button
                                class="btn btn-sm ${
                                  need
                                    ? "btn-secondary"
                                    : "btn-danger"
                                }"
                                onclick="toggleCompra(${p.id})"
                              >
                                ${
                                  need
                                    ? "Marcar ok"
                                    : "Comprar"
                                }
                              </button>


                              <button
                                class="btn btn-sm btn-secondary btn-icon"
                                onclick="openModal(${p.id})"
                              >
                                Editar
                              </button>


                              <button
                                class="btn btn-sm btn-danger btn-icon"
                                onclick="excluir(${p.id})"
                              >
                                Excluir
                              </button>

                            </div>

                          </td>

                        </tr>

                      `;

                    }).join("")}

                  </tbody>

                </table>

              </div>

              `
            }

          </div>

        </div>

      </div>

    </div>

  `;

}


// =====================================================
// FILTRO
// =====================================================

function setFilter(filter) {

  currentFilter = filter;

  render();
}


// =====================================================
// MODAL
// =====================================================

function openModal(id = null) {

  editId = id;
  document.getElementById("salvar-produto").textContent = id ? "Salvar alterações" : "Salvar produto";

  const produto = id

    ? produtosCache.find(
        p => Number(p.id) === Number(id)
      )

    : null;


  const p = produto || {};
  versaoFormulario = p.versao;
  chaveCadastro = id ? null : crypto.randomUUID();


  document.getElementById(
    "modal-title"
  ).textContent = id
    ? "Editar Produto"
    : "Novo Produto";


  document.getElementById(
    "modal-body"
  ).innerHTML = `

    <div class="form-group">

      <label for="f-nome">Nome do produto *</label>

      <input
        id="f-nome" required
        value="${escapeHTML(p.nome || "")}"
        placeholder="Ex: Arroz 5kg"
      >

    </div>


    <div class="form-group">

      <label for="f-preco">Preço *</label>

      <input
        id="f-preco" required
        type="number"
        min="0"
        step="0.01"
        value="${p.preco ?? 0}"
        placeholder="Ex: 25.90"
      >

    </div>


    <div class="form-row">

      <div class="form-group">

        <label for="f-categoria">Categoria</label>

        <input
          id="f-categoria"
          value="${escapeHTML(p.categoria || "")}"
          placeholder="Ex: Mercearia"
        >

      </div>


      <div class="form-group">

        <label for="f-unidade">Unidade</label>

        <input
          id="f-unidade"
          value="${escapeHTML(p.unidade || "un")}"
          placeholder="un, kg, pct"
        >

      </div>

    </div>


    <div class="form-row">

      <div class="form-group">

        <label for="f-estoque">Estoque atual *</label>

        <input
          id="f-estoque" required
          type="number"
          min="0"
          step="1"
          value="${p.estoque ?? 0}"
        >

      </div>


      <div class="form-group">

        <label for="f-minimo">Estoque mínimo *</label>

        <input
          id="f-minimo" required
          type="number"
          min="0"
          step="1"
          value="${p.minimo ?? 0}"
        >

      </div>

    </div>


    <div class="form-group">

      <label
        style="
          display:flex;
          align-items:center;
          gap:8px
        "
      >

        <input
          id="f-comprar"
          type="checkbox"
          style="width:auto"
          ${p.comprar ? "checked" : ""}
        >

        Marcar manualmente como precisa comprar

      </label>

    </div>


  `;


  const overlay = document.getElementById("modal-overlay");
  document.getElementById("app").inert = true;
  overlay.inert = false;
  overlay.classList.add("open");
  document.getElementById("campos-produto").scrollTop = 0;
  document.getElementById("f-nome").focus({ preventScroll: true });
}


// =====================================================
// SALVAR
// =====================================================

async function salvar() {
  if (salvando) return;

  const nome = document
    .getElementById("f-nome")
    .value
    .trim();


  const preco = Number(
    document.getElementById("f-preco").value || 0
  );


  const categoria = document
    .getElementById("f-categoria")
    .value
    .trim() || "Outros";


  const unidade = document
    .getElementById("f-unidade")
    .value
    .trim() || "un";


  const estoque = Number(
    document.getElementById("f-estoque").value || 0
  );


  const minimo = Number(
    document.getElementById("f-minimo").value || 0
  );


  const comprar = document
    .getElementById("f-comprar")
    .checked;


  if (!nome) {

    showToast(
      "Informe o nome do produto.",
      "warn"
    );

    return;

  }


  if (![preco, estoque, minimo].every(Number.isFinite) || preco < 0 || estoque < 0 || minimo < 0) {

    showToast(
      "Os valores não podem ser negativos.",
      "warn"
    );

    return;

  }


  const dados = {
    nome,
    preco,
    estoque,
    categoria,
    minimo,
    unidade,
    comprar
  };


  const form = document.getElementById("form-produto");
  const botao = document.getElementById("salvar-produto");
  const rotulo = botao.textContent;
  const controles = form.querySelectorAll("fieldset, button");
  salvando = true;
  form.setAttribute("aria-busy", "true");
  controles.forEach(controle => { controle.disabled = true; });
  botao.textContent = "Salvando…";
  try {
    if (editId) {

      await atualizarProduto(
        editId,
        dados
      );

      showToast(
        "Produto atualizado com sucesso!",
        "success"
      );

    } else {

      await criarProduto(dados);

      showToast(
        "Produto cadastrado com sucesso!",
        "success"
      );

    }


  } catch (erro) {

    console.error(erro);

    showToast(
      erro.message ||
      "Não foi possível salvar o produto.",
      "warn"
    );

    return;
  } finally {
    salvando = false;
    form.removeAttribute("aria-busy");
    controles.forEach(controle => { controle.disabled = false; });
    botao.textContent = rotulo;
  }

  closeModal();
  await carregarPaginaProdutos();
}


// =====================================================
// COMPRAR / MARCAR OK
// =====================================================

async function toggleCompra(id) {

  const produto = produtosCache.find(
    p => Number(p.id) === Number(id)
  );


  if (!produto) {
    return;
  }


  let novoEstoque = Number(
    produto.estoque || 0
  );


  let novoComprar;


  if (precisaComprar(produto)) {

    novoComprar = false;

    novoEstoque = Math.max(
      novoEstoque,
      Number(produto.minimo || 0) + 1
    );

  } else {

    novoComprar = true;

  }


  try {

    await atualizarProduto(
      produto.id,
      {
        nome: produto.nome,
        preco: produto.preco,
        estoque: novoEstoque,
        categoria: produto.categoria || "Outros",
        minimo: Number(produto.minimo || 0),
        unidade: produto.unidade || "un",
        comprar: novoComprar
      }, produto.versao
    );


    await carregarPaginaProdutos();


  } catch (erro) {

    console.error(erro);

    showToast(
      erro.message ||
      "Não foi possível atualizar o produto.",
      "warn"
    );

  }

}


// =====================================================
// EXCLUIR
// =====================================================

function excluir(id) {
  const versao = produtosCache.find(p => Number(p.id) === Number(id))?.versao;

  showConfirm(
    "Tem certeza que deseja excluir este produto?",

    async () => {

      try {

        await removerProduto(id, versao);

        showToast(
          "Produto excluído com sucesso!",
          "success"
        );

        await carregarPaginaProdutos();

      } catch (erro) {

        console.error(erro);

        showToast(
          erro.message ||
          "Não foi possível excluir o produto.",
          "warn"
        );

      }

    }
  );

}


// =====================================================
// FECHAR MODAL
// =====================================================

function closeModal() {
  if (salvando) return;
  const overlay = document.getElementById("modal-overlay");
  overlay.inert = true;
  overlay.classList.remove("open");
  document.getElementById("app").inert = false;

  editId = null;
}


document
  .getElementById("modal-overlay")
  .addEventListener("click", function(e) {

    if (e.target === this) {
      closeModal();
    }

  });


// =====================================================
// INÍCIO
// =====================================================

iniciarPagina(carregarPaginaProdutos);

</script>

</body>
</html>
